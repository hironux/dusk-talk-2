    TOP.en[id].split(',').forEach(k=>{
      if(k.indexOf(' ')>=0){if(low.indexOf(k)>=0)cnt[id]=(cnt[id]||0)+1}
      else if(toks.some(t=>t===k||t===k+'s'))cnt[id]=(cnt[id]||0)+1;

  if(!best){cl.forEach(c=>{const t=trimC(c.t);if(t.length<27||t.length>40)return;const s=c.cs||0;if(s>bs){bs=s;best=t}})}

// The whole reading of one message.
function analyze(text){

    let cs=0;for(const id in sc){tot[id]=(tot[id]||0)+sc[id]*wgt;cs+=sc[id]}

  });
  const ranked=MIDS.map(id=>[id,tot[id]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);

function isCrisis(text){

function foldMix(){
  let S={};
  msgs.forEach(m=>{
    if(m.r!=='u')return;
    const v=m.v||{[m.m||'neutral']:1},nx={},f=Object.keys(v).some(k=>k!=='neutral')?.5:.9;

function mixOf(S){
  const r=Object.keys(S).map(k=>[k,S[k]]).sort((a,b)=>b[1]-a[1]);
  if(!r.length)return [['neutral',1]];

  return out;
}
function sessionMood(){

function mixHex(a,b,t){const x=hexRgb(a),y=hexRgb(b);return '#'+[0,1,2].map(k=>Math.round(x[k]+(y[k]-x[k])*t).toString(16).padStart(2,'0')).join('')}

/* ---------- 4. Talking: what to say next ---------- */
const PREF={
neutral:['label','weather','body','scene'],
tired:['scene','body','spark','need','proud','tomorrow'],
anxious:['scene','scale','body','friend','need','tomorrow'],
sad:['scene','body','meaning','spark','friend','tomorrow'],

const POOL=['meaning','friend','proud','body','spark','need'];
const HEAVY=['sad','anxious','angry','lonely'],POS=['spark','proud','share'];
function firstFree(list,asked){for(let i=0;i<list.length;i++)if(asked.indexOf(list[i])<0)return list[i];return null}
function userRecs(){return msgs.filter(m=>m.r==='u')}
function lastTopic(){for(let i=msgs.length-1;i>=0;i--){const m=msgs[i];if(m.r==='u'&&m.tp&&m.tp[0])return m.tp[0]}return ''}
function firstQuote(us,cur){
  for(let i=0;i<us.length;i++){const m=us[i];if(m.ch||m.c||m.na)continue;const e=analyze(m.t).echo;if(e&&e!==cur)return e}
  return '';
}
// Decide the shape of the next reply. The record only holds choices (not text), so it can be shown in either language.
function planReply(text,an){
  const us=userRecs(),n=us.length,bots=msgs.filter(m=>m.r==='b');
  const lastB=bots.length?bots[bots.length-1]:null;
  const asked=bots.slice(-3).map(b=>b.qt);
  const ctx=an.p!=='neutral'?an.p:sessionMood();
  const seed=hash(text)+n*7;
  const rec={r:'b',mood:an.p,mood2:an.s,lm:an.lm,cm:ctx,tp:an.tp[0]||lastTopic(),e:seed,qv:Math.floor(seed/3)};
  if(lastB&&lastB.ak==='emp'&&lastB.mood===an.p&&lastB.e%2===rec.e%2)rec.e++;
  if(lastB&&lastB.qt==='scale'&&an.num!==null&&an.len<=14){rec.ak='sc';rec.sv=an.num}
  else if(an.nonAnswer)rec.ak='na';
  else if(an.p!=='neutral'&&an.s)rec.ak='mix';
  else rec.ak='emp';
  if(isSkip(text)&&rec.ak!=='sc')rec.ak='skip';
  const heavy=HEAVY.indexOf(ctx)>=0;
  const listening=(rec.ak==='emp'||rec.ak==='mix');
  if(rec.ak==='skip')rec.noq=1;
  if(listening){
    if(n===1&&rec.ak==='emp'&&an.echo&&(an.cl.length>=2||an.len>=25)){rec.ex='echo';rec.eq=an.echo}
    else if(n===2)rec.ex='ins';
    else if(n===3){const q=firstQuote(us.slice(0,-1),an.echo);if(q){rec.ex='cb';rec.eq=q}else if(!bots.some(b=>b.ex==='ins'))rec.ex='ins'}
  }
  // A small recap, once a night: say back what was heard before asking anything more.
  if(listening&&n>=3&&!an.end&&!bots.some(b=>b.sm)){
    const mx=mixOf(foldMix());
    if(mx[0][0]!=='neutral'){rec.sm=1;rec.sa=mx[0][0];if(mx[1])rec.sb=mx[1][0];const q=firstQuote(us,an.echo);if(q)rec.sq=q;delete rec.ex;delete rec.eq}
  }
  // Some turns only receive what was said: no question at all. After a long, heavy message, and every third turn.
  if(listening&&!rec.sm&&!an.end&&n>=2&&lastB&&lastB.r==='b'&&!lastB.noq&&lastB.qt!=='close'&&((heavy&&an.len>=40)||n%3===0)){
    rec.noq=1;if(an.echo){rec.ex='echo';rec.eq=an.echo}
  }
  const ok=t=>{
    if(t==='scale'&&bots.some(b=>b.qt==='scale'))return false;
    if(POS.indexOf(t)>=0&&(n<2||(heavy&&(n<4||an.int>=.5))))return false;
    return true;
  };
  let qt;
  if(rec.noq){rec.nq=1}
  else if(an.end&&n>=2)qt='close';
  else if(lastB&&lastB.qt==='spark'&&an.len<=16&&!an.nonAnswer)qt='detail';
  else if(an.nonAnswer)qt=firstFree(['weather','label','body'],asked)||'weather';
  else if(ctx==='neutral')qt=firstFree(PREF.neutral,asked)||'label';
  else{
    let list=PREF[ctx].filter(t=>asked.indexOf(t)<0);
    if(an.len>=45||bots.some(b=>b.qt==='scene'))list=list.filter(t=>t!=='scene');
    if(n<4||bots.some(b=>b.qt==='tomorrow'))list=list.filter(t=>t!=='tomorrow');
    else if(asked.indexOf('tomorrow')<0)list.unshift('tomorrow');
    if(['family','friends','partner'].indexOf(rec.tp)>=0&&['sad','angry','lonely'].indexOf(ctx)>=0&&list.indexOf('body')>=0){list=list.filter(t=>t!=='body');list.push('body')}
    list=list.filter(ok);
    qt=list[0]||firstFree(POOL.filter(ok),asked)||'meaning';
  }
  if(qt)rec.qt=qt;
  if(n>=4)rec.wr=1;
  return rec;
}
function pickQ(m,d){
  const Q=d.Q[m.qt],mv=Q.mv&&Q.mv[m.cm];
  const list=(mv||Q.b).filter(s=>s.indexOf('{t}')<0||m.tp);
  return fmt(list[Math.floor(m.qv)%list.length],{t:m.tp?d.topic[m.tp]:''});
}
function nm(id,d){const s=d.mood[id][0];return lang==='en'?s.toLowerCase():s}
function botText(m,d){
  if(m.qt==='close')return d.closeAsk;
  const own=d.rp[m.mood]||d.rp.neutral,ctx=d.rp[m.cm]||d.rp.neutral,parts=[],sep=lang==='ja'?'':' ';
  if(m.ak==='skip')parts.push(d.skip[m.e%d.skip.length]);
  else if(m.ak==='sc')parts.push(m.sv<=3?d.scLow:m.sv>=7?d.scHigh:d.scMid);
  else if(m.ak==='na')parts.push(d.na[m.e%d.na.length]);
  else if(m.ak==='mix'&&!m.sm){const lastM=m.lm||m.mood,firstM=lastM===m.mood?m.mood2:m.mood;parts.push(fmt(d.mix,{a:nm(firstM,d),b:nm(lastM,d)}))}
  else parts.push(own.emp[m.e%own.emp.length]);
  if(m.ex==='echo')parts.push(fmt(d.echo,{q:m.eq}));
  else if(m.ex==='ins')parts.push(ctx.ins[m.e%ctx.ins.length]);
  else if(m.ex==='cb')parts.push(fmt(d.cb,{q:m.eq}));
  if(m.sm){let t=m.sb?fmt(d.recap2,{a:nm(m.sa,d),b:nm(m.sb,d)}):fmt(d.recap1,{a:nm(m.sa,d)});if(m.sq)t+=sep+fmt(d.recapQ,{q:m.sq});parts.push(t)}
  if(m.noq){if(m.ak!=='skip')parts.push(d.rest[m.e%d.rest.length]);return parts.join(sep)}
  return parts.join(sep)+'\n'+pickQ(m,d);
}
function chipsFor(m,d){
  const out=[];
  if(m.noq){out.push({l:d.wrap,act:'wrap'});return out}
  if(m.qt==='close'){out.push({l:d.wrap,act:'wrap'});out.push({l:d.more,t:d.moreSend});return out}
  const C=d.QC[m.qt];
  if(C){
    const arr=(C.mv&&C.mv[m.cm]!==undefined)?C.mv[m.cm]:(C.b||[]);
    arr.forEach(x=>out.push({l:x[0],t:x[1]||x[0],f:x[2]||null}));
  }
  if(m.wr)out.push({l:d.wrap,act:'wrap'});
  return out;
}

/* ---------- 5. Today's line ---------- */
function pickQuote(us){
  let best={s:0,t:''};
  us.forEach((m,idx)=>{
    if(m.ch||m.c||m.na)return;
    clauseList(m.t).forEach(c=>{
      const t=trimC(c.t);if(t.length<5||t.length>30)return;
      const sc=scoreClause(c.t);let tot=0,light=0;
      for(const id in sc){tot+=sc[id];if(id==='calm'||id==='happy')light+=sc[id]}
      const s=tot+light*.8+idx*.15+(t.length>=8?.3:0);
      if(s>best.s)best={s:s,t:t};
    });
  });
  if(best.t)return best.t;
  let longest='';
  us.forEach(m=>{if(!m.ch&&!m.c&&!m.na&&m.t.length>longest.length)longest=m.t});
  longest=trimC(longest);
  return longest.length>28?longest.slice(0,28)+'…':longest;
}
function oneLiner(s,d){
  const f=d.mood;
  if(s.q&&s.arc){
    const a=s.arc[0],b=s.arc[1];
    if((b==='calm'||b==='happy')&&a!=='calm'&&a!=='happy')return fmt(d.arcUp,{a:nm(a,d),b:nm(b,d),q:s.q});
  }
  if(s.q){const arr=d.line[s.dom]||d.line.neutral;return fmt(arr[hash(s.q)%arr.length],{q:s.q})}
  return d.close[s.dom];
}
function flowText(s,d){
  const out=[];
  if(s.tps&&s.tps.length)out.push(fmt(d.flowTp,{t:s.tps.map(id=>d.topic[id]).join(d.and)}));
  if(s.arc){
    const a=s.arc[0],b=s.arc[1],up=(b==='calm'||b==='happy')&&a!=='calm'&&a!=='happy';
    if(!(up&&s.q))out.push(fmt(d.flowArc,{a:nm(a,d),b:nm(b,d)}));
  }
  return out.join(lang==='ja'?'':' ');
}

/* ---------- 6. Saving and the next day ---------- */
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function tally(us){
  const c={};us.forEach(m=>{c[m.m]=(c[m.m]||0)+1;if(m.m2)c[m.m2]=(c[m.m2]||0)+1});
  let ids=Object.keys(c);const non=ids.filter(i=>i!=='neutral');if(non.length)ids=non;
  const dom=ids.slice().sort((a,b)=>c[b]-c[a])[0];
  return {c:c,ids:ids,dom:dom};
}
function saveLast(day,dom){try{localStorage.setItem('dusktalk2_last',JSON.stringify({day:day,dom:dom}))}catch(e){}}
function prevDom(){
  try{
    const l=JSON.parse(localStorage.getItem('dusktalk2_last')||'null');
    if(l&&MM[l.dom]&&l.day&&l.day!==today()){const g=daysBetween(l.day,today());if(g>=1&&g<=3)return l.dom}
  }catch(e){}
  return null;
}
function save(){try{localStorage.setItem('dusktalk2_state',JSON.stringify({msgs:msgs,day:today()}))}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('dusktalk2_state')||'null');
    if(!(d&&Array.isArray(d.msgs)&&d.msgs.length))return;
    if(d.day&&d.day!==today()){
      const us=d.msgs.filter(m=>m.r==='u');
      if(us.length>=2&&!us.some(m=>m.c)&&!d.msgs.some(m=>m.r==='s'))saveLast(d.day,tally(us).dom);
      return;
    }
    msgs=d.msgs;
  }catch(e){}
}
function initLang(){
  let l=null;
  if(window.APP_LANG==='ja'||window.APP_LANG==='en')l=window.APP_LANG;
  if(!l){try{const q=new URLSearchParams(location.search).get('lang');if(q==='ja'||q==='en')l=q}catch(e){}}
  if(!l){try{const s=localStorage.getItem('dusktalk2_lang');if(s==='ja'||s==='en')l=s}catch(e){}}
  if(!l){try{l=(navigator.language||'').toLowerCase().indexOf('ja')===0?'ja':null}catch(e){}}
  lang=l||'en';
}

/* ---------- 7. Drawing ---------- */
function renderLegend(){
  const lg=$('#lg');lg.innerHTML='';
  MOODS.forEach(m=>{
    const b=document.createElement('button');b.type='button';b.setAttribute('data-demo','legend-'+m.id);
    const sw=document.createElement('span');sw.className='sw';sw.style.background='linear-gradient(180deg,'+m.c[0]+','+m.c[2]+')';
    const t=document.createElement('span');const n=T().mood[m.id];t.textContent=m.face+' '+n[0]+'＝'+n[1];
    b.append(sw,t);b.onclick=()=>setMix([[m.id,1]],.5);lg.appendChild(b);
  });
}
function renderStarters(){
  const box=$('#starters');box.innerHTML='';
  if(msgs.some(m=>m.r==='u'))return;
  T().starters.forEach((s,i)=>{
    const b=document.createElement('button');b.type='button';b.textContent=s;b.setAttribute('data-demo','starter-'+(i+1));
    b.onclick=()=>send(s);box.appendChild(b);
  });
}
function mkRow(cls){const r=document.createElement('div');r.className='row '+cls;return r}
function qrRow(m,d){
  const chips=chipsFor(m,d);if(!chips.length)return null;
  const box=document.createElement('div');box.className='qr';box.setAttribute('data-demo','quick-replies');
  chips.forEach(c=>{
    const b=document.createElement('button');b.type='button';b.className='qbtn';b.textContent=c.l;
    if(c.act==='wrap')b.onclick=()=>wrapUp();
    else b.onclick=()=>send(c.t,{ch:1,force:c.f});
    box.appendChild(b);
  });
  return box;
}
function buildNode(m,isLast){
  const d=T();
  if(m.r==='u'){const r=mkRow('user');const b=document.createElement('div');b.className='bubble user';b.textContent=m.t;r.appendChild(b);return r}
  if(m.r==='g'){
    const r=mkRow('bot');
    if(m.prev&&MM[m.prev]){const p=document.createElement('div');p.className='bubble bot prev';p.setAttribute('data-demo','prev-step');p.textContent=d.prevLead+d.tmr[m.prev]+'\n'+d.prevAsk;r.appendChild(p)}
    const b=document.createElement('div');b.className='bubble bot';b.textContent=d.greet;r.appendChild(b);return r;
  }
  if(m.r==='c'){
    const r=mkRow('bot');const b=document.createElement('div');b.className='bubble bot care';b.setAttribute('data-demo','care-message');
    const h=document.createElement('div');h.textContent=d.careHead;
    const p=document.createElement('div');p.textContent=d.careBody;
    const hp=document.createElement('div');hp.textContent=d.careHelp;
    const ul=document.createElement('ul');
    d.careLines.forEach(x=>{
      const li=document.createElement('li');li.append(x[0]+(x[1]?' ':''));
      if(x[1]){const a=document.createElement('a');a.href='tel:'+x[1].replace(/-/g,'');a.textContent=x[1];li.appendChild(a)}
      ul.appendChild(li);
    });
    const t=document.createElement('div');t.textContent=d.careTail;
    b.append(h,p,hp,ul,t);r.appendChild(b);return r;
  }
  if(m.r==='b'){
    const r=mkRow('bot');
    if(m.mood&&m.mood!=='neutral'){
      const c=document.createElement('div');c.className='chip';
      const names=[d.mood[m.mood][0]].concat(m.mood2?[d.mood[m.mood2][0]]:[]).join(d.dot);
      c.textContent=MM[m.mood].face+' '+fmt(d.sensed,{m:names});r.appendChild(c);
    }
    const b=document.createElement('div');b.className='bubble bot';b.textContent=botText(m,d);r.appendChild(b);
    if(isLast){const qr=qrRow(m,d);if(qr)r.appendChild(qr)}
    return r;
  }
  if(m.r==='s'){
    const r=mkRow('bot');const mo=MM[m.dom],mix=m.mix||[[m.dom,1]];
    const card=document.createElement('div');card.className='card';card.setAttribute('data-demo','summary-card');
    const strip=document.createElement('div');strip.className='strip';strip.style.background=gradOf(mix,'135deg');
    const sb=document.createElement('b');sb.textContent=d.sumTitle+'：'+skyNames(mix);
    const ss=document.createElement('span');ss.textContent=mix.map(x=>MM[x[0]].orb).join('');strip.append(sb,ss);
    const body=document.createElement('div');body.className='body';
    const hl=document.createElement('h3');hl.textContent=d.sumLine;
    const lead=document.createElement('p');lead.className='lead';lead.setAttribute('data-demo','summary-line');lead.textContent=oneLiner(m,d);
    body.append(hl,lead);
    const ft=flowText(m,d);
    if(ft){const fp=document.createElement('p');fp.className='flow';fp.textContent=ft;body.appendChild(fp)}
    const h=document.createElement('h3');h.textContent=d.sumMoods;
    const mc=document.createElement('div');mc.className='mchips';
    m.counts.forEach(x=>{const e=document.createElement('em');e.textContent=MM[x[0]].face+' '+d.mood[x[0]][0]+' ×'+x[1];mc.appendChild(e)});
    const nt=document.createElement('div');nt.className='note';
    const h2=document.createElement('h3');h2.textContent=d.sumTmr;const p2=document.createElement('p');p2.style.margin='0';p2.textContent=d.tmr[m.dom];nt.append(h2,p2);
    const p3=document.createElement('p');p3.style.cssText='margin:12px 0;color:#6b5a85;font-size:13px';p3.textContent=fmt(d.sumTalked,{n:m.n})+' '+d.sumGood+' 🌙';
    const row=document.createElement('div');row.className='btnrow';
    const cb=document.createElement('button');cb.type='button';cb.className='cbtn sub';cb.textContent=d.copy;cb.setAttribute('data-demo','summary-copy');
    cb.onclick=()=>{
      const txt=oneLiner(m,T());
      try{navigator.clipboard.writeText(txt).then(()=>toast(T().copied),()=>toast(T().copyFail))}catch(e){toast(T().copyFail)}
    };
    const nb=document.createElement('button');nb.type='button';nb.className='cbtn';nb.textContent=d.sumNew;nb.setAttribute('data-demo','summary-new');nb.onclick=newNight;
    row.append(cb,nb);
    body.append(h,mc,nt,p3,row);card.append(strip,body);r.appendChild(card);return r;
  }
}
function scrollEnd(){chat.scrollTop=chat.scrollHeight}
function renderAll(){chat.innerHTML='';msgs.forEach((m,i)=>chat.appendChild(buildNode(m,i===msgs.length-1)));scrollEnd();renderStarters()}
function append(m){
  chat.querySelectorAll('.qr').forEach(e=>e.remove());
  msgs.push(m);chat.appendChild(buildNode(m,true));scrollEnd();save();
}
function toast(txt){
  const t=$('#toast');t.textContent=txt;clearTimeout(toastT);toastT=setTimeout(()=>{t.textContent=''},3800);
}
function showTyping(){
  const r=mkRow('bot typing');r.id='typing';const b=document.createElement('div');b.className='bubble bot';b.setAttribute('aria-label',T().typing);
  b.innerHTML='<i></i><i></i><i></i>';r.appendChild(b);chat.appendChild(r);scrollEnd();
}

/* ---------- 8. Sending ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Where replies come from. Today: the built-in planner above, nothing leaves the device.
// Later: call the AI endpoint inside getReply() and return {r:'b',mood:..,text:..}; botText() shows m.text if you add it,
// and any error falls back to localReply(). (Then also update the 'fine' notice and add connect-src to the Content-Security-Policy.)
function localReply(text,an){return planReply(text,an)}
async function getReply(text,an){await sleep(1100);return localReply(text,an)}
function send(text,opts){
  opts=opts||{};
  text=(text||'').trim();
  if(!text){toast(T().toastEmpty);return}
  if(busy)return;
  clearTimeout(nudgeT);
  busy=true;$('#send').disabled=true;
  const crisis=isCrisis(text);
  const an=analyze(text);
  if(opts.force&&MM[opts.force]){an.p=opts.force;an.s=null;an.vec={};an.vec[opts.force]=1.1;an.int=.6}
  const um={r:'u',t:text,m:an.p,m2:an.s,v:an.vec,i:an.int,tp:an.tp};
  if(an.nonAnswer)um.na=1;
  if(opts.ch)um.ch=1;
  if(crisis)um.c=1;
  append(um);renderStarters();
  setMix(mixOf(foldMix()),um.i);
  const n=msgs.filter(m=>m.r==='u').length;
  showTyping();
  const reply=crisis?sleep(1100).then(()=>({r:'c'})):getReply(text,an).catch(()=>localReply(text,an));
  reply.then(rep=>{
    const ty=$('#typing');if(ty)ty.remove();
    append(rep);
    busy=false;$('#send').disabled=false;
    if(!crisis&&n>=3&&!hinted){hinted=true;toast(T().toastHint)}
    if(rep.r==='b'){nudgeT=setTimeout(()=>{if(msgs.length&&msgs[msgs.length-1]===rep)toast(T().nudge)},50000)}
    $('#msg').focus({preventScroll:true});
  });
}
function wrapUp(){
  const us=userRecs();
  if(us.length<2){toast(T().toastMore);return}
  const lastR=msgs.length?msgs[msgs.length-1].r:'';
  // A night that touched something heavy is not closed with a cheerful card; the care message stays.
  if(us.some(m=>m.c)){if(lastR!=='c')append({r:'c'});return}
  if(lastR==='s')return;
  const mix=mixOf(foldMix()),t=tally(us);
  const dom=mix[0][0]!=='neutral'?mix[0][0]:t.dom;
  const counts=t.ids.map(i=>[i,t.c[i]]);
  const nn=us.filter(m=>m.m&&m.m!=='neutral');
  const arc=nn.length>=2&&nn[0].m!==nn[nn.length-1].m?[nn[0].m,nn[nn.length-1].m]:null;
  const tc={};us.forEach(m=>(m.tp||[]).forEach(id=>{tc[id]=(tc[id]||0)+1}));
  const tps=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]).slice(0,2);
  const q=pickQuote(us);
  setMix(mix,curInt);saveLast(today(),dom);
  append({r:'s',counts:counts,dom:dom,n:us.length,q:q,arc:arc,tps:tps,mix:mix});
}
function newNight(){
  clearTimeout(nudgeT);
  msgs=[{r:'g',prev:prevDom()}];hinted=false;busy=false;$('#send').disabled=false;
  const ty=$('#typing');if(ty)ty.remove();
  setMix([['neutral',1]],0);renderAll();save();toast(T().toastNew);
}
function applyI18N(){
  const d=T();document.documentElement.lang=lang;document.title=d.title;
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=d[e.dataset.i18n]});
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>{e.placeholder=d[e.dataset.i18nPh]});
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>{e.setAttribute('aria-label',d[e.dataset.i18nAria])});
  $('#lj').classList.toggle('act',lang==='ja');$('#le').classList.toggle('act',lang==='en');
}
function setLang(l){
  lang=l;try{localStorage.setItem('dusktalk2_lang',l)}catch(e){}
  applyI18N();updatePill();renderLegend();renderAll();$('#toast').textContent='';
}
initLang();buildSky();load();
if(!msgs.length)msgs=[{r:'g',prev:prevDom()}];
{const us=userRecs();setMix(us.length?mixOf(foldMix()):[['neutral',1]],us.length?(us[us.length-1].i||0):0)}
applyI18N();renderLegend();renderAll();
$('#form').addEventListener('submit',e=>{e.preventDefault();const i=$('#msg'),v=i.value;if(!v.trim()){toast(T().toastEmpty);return}if(busy)return;i.value='';send(v)});
$('#langBtn').onclick=()=>setLang(lang==='ja'?'en':'ja');
$('#newBtn').onclick=newNight;
$('#wrapBtn').onclick=wrapUp;
$('#pill').onclick=()=>{const o=$('#legend').classList.toggle('open');$('#pill').setAttribute('aria-expanded',o)};
</script>
